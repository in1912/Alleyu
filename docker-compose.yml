services:
  alleyu:
    build: .
    container_name: alleyu
    restart: unless-stopped
    ports:
      - '9610:9610'
    environment:
      # 首个管理员（只在空库时创建），部署后请改密码
      DEFAULT_ADMIN: admin
      DEFAULT_ADMIN_PASSWORD: admin123
      # 高德 Web 服务 Key 可在这里注入（仅首次空库种子生效；之后在设置页维护）
      # AMAP_KEY: <到 lbs.amap.com 申请的 32 位 Key>
      # 桩模式（测试用，不要在生产开）
      # ALLEYU_AI_STUB: '1'
    volumes:
      - ./data:/app/data
